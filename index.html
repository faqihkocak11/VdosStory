<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinemaGold</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

::-webkit-scrollbar{
width:5px;
}

::-webkit-scrollbar-thumb{
background:gold;
border-radius:10px;
}

.app{
padding-bottom:90px;
}

/* Splash */

.splash{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
animation:hideSplash 3s forwards;
}

.splash h1{
font-size:40px;
color:gold;
}

.splash span{
color:white;
}

.loader{
width:220px;
height:5px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.loader div{
height:100%;
width:0;
background:linear-gradient(to right,gold,white);
animation:load 3s forwards;
}

@keyframes load{
100%{
width:100%;
}
}

@keyframes hideSplash{
90%{
opacity:1;
}
100%{
opacity:0;
visibility:hidden;
}
}

/* Header */

header{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:100;
backdrop-filter:blur(20px);
background:rgba(0,0,0,0.6);
}

.logo{
font-size:25px;
font-weight:bold;
color:gold;
}

.logo span{
color:white;
}

.searchBar{
background:#111;
border:1px solid rgba(255,215,0,0.2);
padding:10px 15px;
border-radius:30px;
display:flex;
align-items:center;
gap:10px;
width:100%;
margin:15px 0;
}

.searchBar input{
background:none;
border:none;
outline:none;
color:white;
width:100%;
font-size:15px;
}

/* Video Grid */

.video-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:15px;
}

.video-card{
background:rgba(255,255,255,0.05);
border-radius:20px;
overflow:hidden;
backdrop-filter:blur(10px);
transition:0.3s;
cursor:pointer;
border:1px solid rgba(255,215,0,0.1);
}

.video-card:hover{
transform:translateY(-5px) scale(1.02);
box-shadow:0 0 20px rgba(255,215,0,0.2);
}

.video-card img{
width:100%;
height:180px;
object-fit:cover;
}

.video-info{
padding:10px;
}

.video-title{
font-size:14px;
font-weight:600;
margin-bottom:6px;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}

.channel{
font-size:12px;
color:#bbb;
}

/* Shorts */

.shorts{
display:flex;
flex-direction:column;
gap:20px;
padding:15px;
}

.short-card{
height:85vh;
border-radius:25px;
overflow:hidden;
position:relative;
background:black;
}

.short-card iframe{
width:100%;
height:100%;
}

.short-overlay{
position:absolute;
bottom:20px;
left:20px;
z-index:5;
}

.short-actions{
position:absolute;
right:15px;
bottom:40px;
display:flex;
flex-direction:column;
gap:20px;
font-size:24px;
z-index:5;
}

.short-actions i{
background:rgba(0,0,0,0.5);
padding:12px;
border-radius:50%;
}

/* Bottom Nav */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:75px;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(20px);
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid rgba(255,215,0,0.2);
z-index:999;
}

.nav-btn{
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
font-size:12px;
color:#aaa;
cursor:pointer;
transition:0.3s;
}

.nav-btn.active{
color:gold;
}

.nav-btn i{
font-size:22px;
}

/* Modal */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
padding:20px;
z-index:9999;
}

.modal-content{
width:100%;
max-width:900px;
background:#111;
border-radius:25px;
overflow:hidden;
position:relative;
animation:popup 0.3s;
}

@keyframes popup{
from{
transform:scale(0.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.modal iframe{
width:100%;
height:500px;
}

.close{
position:absolute;
top:10px;
right:15px;
font-size:28px;
cursor:pointer;
z-index:10;
}

.modal-info{
padding:20px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

.actions button{
padding:10px 18px;
border:none;
border-radius:30px;
background:linear-gradient(to right,gold,white);
color:black;
font-weight:bold;
cursor:pointer;
}

/* Skeleton */

.skeleton{
height:260px;
border-radius:20px;
background:linear-gradient(
90deg,
#111 25%,
#1d1d1d 50%,
#111 75%
);
background-size:200% 100%;
animation:skeleton 1.5s infinite;
}

@keyframes skeleton{
0%{
background-position:200% 0;
}
100%{
background-position:-200% 0;
}
}

/* Hidden */

.page{
display:none;
}

.page.active{
display:block;
}

/* Responsive */

@media(max-width:700px){

.video-card img{
height:140px;
}

.modal iframe{
height:250px;
}

.short-card{
height:78vh;
}

}
</style>
</head>
<body>

<!-- Splash -->

<div class="splash">
<h1>Cinema<span>Gold</span></h1>
<div class="loader">
<div></div>
</div>
</div>

<div class="app">

<header>
<div class="logo">
<i class="fa-solid fa-play"></i>
Cinema<span>Gold</span>
</div>
</header>

<!-- HOME -->

<div id="homePage" class="page active">

<div style="padding:15px;">
<div class="searchBar">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" id="searchInput" placeholder="Cari video...">
</div>
</div>

<div class="video-grid" id="videoGrid">

<div class="skeleton"></div>
<div class="skeleton"></div>
<div class="skeleton"></div>
<div class="skeleton"></div>

</div>

</div>

<!-- SHORTS -->

<div id="shortsPage" class="page">

<div class="shorts" id="shortsContainer"></div>

</div>

<!-- SEARCH -->

<div id="searchPage" class="page">

<div style="padding:15px;">
<div class="searchBar">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" id="searchVideo" placeholder="Search YouTube Video">
</div>
</div>

<div class="video-grid" id="searchResults"></div>

</div>

</div>

<!-- Bottom Nav -->

<div class="bottom-nav">

<div class="nav-btn active" onclick="showPage('homePage',this)">
<i class="fa-solid fa-house"></i>
<span>Home</span>
</div>

<div class="nav-btn" onclick="showPage('shortsPage',this)">
<i class="fa-solid fa-film"></i>
<span>Shorts</span>
</div>

<div class="nav-btn" onclick="showPage('searchPage',this)">
<i class="fa-solid fa-magnifying-glass"></i>
<span>Search</span>
</div>

</div>

<!-- Modal -->

<div class="modal" id="modal">

<div class="modal-content">

<div class="close" onclick="closeModal()">
<i class="fa-solid fa-xmark"></i>
</div>

<iframe id="player" src="" allowfullscreen></iframe>

<div class="modal-info">

<h2 id="modalTitle"></h2>

<div class="actions">

<button>
<i class="fa-solid fa-thumbs-up"></i>
Like
</button>

<button>
<i class="fa-solid fa-share"></i>
Share
</button>

<button>
<i class="fa-solid fa-bell"></i>
Subscribe
</button>

</div>

</div>

</div>

</div>

<script>
const API_KEY = "AIzaSyDxSElJhyg9TnljXMxu4gLBmkF7JLeglO8"

const videoGrid = document.getElementById("videoGrid")
const searchResults = document.getElementById("searchResults")
const shortsContainer = document.getElementById("shortsContainer")

// SHOW PAGE

function showPage(id,el){

document.querySelectorAll(".page").forEach(page=>{
page.classList.remove("active")
})

document.getElementById(id).classList.add("active")

document.querySelectorAll(".nav-btn").forEach(btn=>{
btn.classList.remove("active")
})

el.classList.add("active")
}

// LOAD TRENDING

async function loadVideos(){

try{

const res = await fetch(
`https://www.googleapis.com/youtube/v3/search?part=snippet&q=trending&type=video&maxResults=20&key=${API_KEY}`
)

const data = await res.json()

videoGrid.innerHTML = ""

data.items.forEach(video=>{

createVideoCard(video,videoGrid)

})

}catch(err){

videoGrid.innerHTML = "<p style='padding:20px;'>Gagal mengambil video</p>"

}

}

// VIDEO CARD

function createVideoCard(video,container){

const card = document.createElement("div")

card.className = "video-card"

card.innerHTML = `
<img loading="lazy"
src="${video.snippet.thumbnails.high.url}">

<div class="video-info">
<div class="video-title">
${video.snippet.title}
</div>

<div class="channel">
${video.snippet.channelTitle}
</div>
</div>
`

card.onclick = ()=>{

openVideo(
video.id.videoId,
video.snippet.title
)

}

container.appendChild(card)

}

// OPEN VIDEO

function openVideo(id,title){

document.getElementById("modal").style.display = "flex"

document.getElementById("player").src =
`https://www.youtube.com/embed/${id}?autoplay=1`

document.getElementById("modalTitle").innerText = title

localStorage.setItem("lastVideo",id)

}

// CLOSE

function closeModal(){

document.getElementById("modal").style.display = "none"

document.getElementById("player").src = ""

}

// SEARCH

document
.getElementById("searchVideo")
.addEventListener("keyup",async(e)=>{

const query = e.target.value

if(query.length < 2) return

localStorage.setItem("history",query)

const res = await fetch(
`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&type=video&maxResults=20&key=${API_KEY}`
)

const data = await res.json()

searchResults.innerHTML = ""

data.items.forEach(video=>{

createVideoCard(video,searchResults)

})

})

// SHORTS

async function loadShorts(){

const res = await fetch(
`https://www.googleapis.com/youtube/v3/search?part=snippet&q=shorts&type=video&videoDuration=short&maxResults=10&key=${API_KEY}`
)

const data = await res.json()

data.items.forEach(video=>{

const div = document.createElement("div")

div.className = "short-card"

div.innerHTML = `
<iframe
src="https://www.youtube.com/embed/${video.id.videoId}"
allowfullscreen>
</iframe>

<div class="short-overlay">
<h3>${video.snippet.title}</h3>
<p>${video.snippet.channelTitle}</p>
</div>

<div class="short-actions">

<i class="fa-solid fa-heart"></i>

<i class="fa-solid fa-share"></i>

<i class="fa-solid fa-plus"></i>

</div>
`

shortsContainer.appendChild(div)

})

}

// INIT

loadVideos()
loadShorts()

</script>

</body>
</html>
